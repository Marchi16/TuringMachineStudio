<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        <span class="logo-circle">TM</span>
        <div>
            <h2>Turing Machine Studio</h2>
            <p data-i18n="tagline"></p>
        </div>
    </div>

    <ul>
        <li><a href="index.html"     data-i18n="nav_home"></a></li>
        <li><a href="simulator.html" data-i18n="nav_simulator"></a></li>
        <li><a href="builder.html"   data-i18n="nav_builder"></a></li>
        <li><a href="theory.html"    data-i18n="nav_theory"></a></li>
        <li><a href="examples.html"  data-i18n="nav_examples"></a></li>
        <li><a href="exercises.html" class="nav-active" data-i18n="nav_exercises"></a></li>
        <li><a href="about.html"     data-i18n="nav_about"></a></li>
    </ul>

    <div class="lang-toggle">
        <button id="langEL" class="lang-btn">ΕΛ</button>
        <button id="langEN" class="lang-btn">EN</button>
    </div>

</nav>

<main class="exercises-container">

    <h1 data-i18n="exercises_title"></h1>

    <p class="subtitle" data-i18n="exercises_subtitle"></p>

    <!-- Progress bar -->
    <div class="progress-bar-wrapper">

        <div class="progress-info">
            <span data-i18n="progress_label"></span>
            <span id="progressText">0 / 4</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>

    </div>

    <div class="exercises-grid">

        <!-- Exercise 1 -->
        <div class="exercise-card" data-exercise="ex1">

            <div class="card-header">
                <span class="level beginner" data-i18n="level_beginner"></span>
                <span class="status-badge" id="status-ex1">
                    <span class="status-dot"></span>
                    <span data-i18n="status_unsolved"></span>
                </span>
            </div>

            <h2>aⁿbⁿ Recognition</h2>

            <p data-i18n="ex1_desc"></p>

            <div class="exercise-tags">
                <span>Marking</span>
                <span>Single Tape</span>
            </div>

            <div class="difficulty">
                <span data-i18n="difficulty"></span>
                ★☆☆☆☆
            </div>

            <div class="hint-box" id="hint-ex1" style="display:none">
                <span class="hint-icon">💡</span>
                <span data-i18n="ex1_hint"></span>
            </div>

            <div class="card-actions">
                <button class="btn-hint" data-target="hint-ex1" data-i18n="show_hint"></button>
                <button class="btn-try"  data-exercise="ex1"    data-i18n="try_exercise"></button>
            </div>

        </div>

        <!-- Exercise 2 -->
        <div class="exercise-card" data-exercise="ex2">

            <div class="card-header">
                <span class="level beginner" data-i18n="level_beginner"></span>
                <span class="status-badge" id="status-ex2">
                    <span class="status-dot"></span>
                    <span data-i18n="status_unsolved"></span>
                </span>
            </div>

            <h2>Even Length Strings</h2>

            <p data-i18n="ex2_desc"></p>

            <div class="exercise-tags">
                <span>Counting</span>
                <span>Parity</span>
            </div>

            <div class="difficulty">
                <span data-i18n="difficulty"></span>
                ★★☆☆☆
            </div>

            <div class="hint-box" id="hint-ex2" style="display:none">
                <span class="hint-icon">💡</span>
                <span data-i18n="ex2_hint"></span>
            </div>

            <div class="card-actions">
                <button class="btn-hint" data-target="hint-ex2" data-i18n="show_hint"></button>
                <button class="btn-try"  data-exercise="ex2"    data-i18n="try_exercise"></button>
            </div>

        </div>

        <!-- Exercise 3 -->
        <div class="exercise-card" data-exercise="ex3">

            <div class="card-header">
                <span class="level intermediate" data-i18n="level_intermediate"></span>
                <span class="status-badge" id="status-ex3">
                    <span class="status-dot"></span>
                    <span data-i18n="status_unsolved"></span>
                </span>
            </div>

            <h2>Binary Increment</h2>

            <p data-i18n="ex3_desc"></p>

            <div class="exercise-tags">
                <span>Arithmetic</span>
                <span>Carry</span>
            </div>

            <div class="difficulty">
                <span data-i18n="difficulty"></span>
                ★★★☆☆
            </div>

            <div class="hint-box" id="hint-ex3" style="display:none">
                <span class="hint-icon">💡</span>
                <span data-i18n="ex3_hint"></span>
            </div>

            <div class="card-actions">
                <button class="btn-hint" data-target="hint-ex3" data-i18n="show_hint"></button>
                <button class="btn-try"  data-exercise="ex3"    data-i18n="try_exercise"></button>
            </div>

        </div>

        <!-- Exercise 4 -->
        <div class="exercise-card" data-exercise="ex4">

            <div class="card-header">
                <span class="level advanced" data-i18n="level_advanced"></span>
                <span class="status-badge" id="status-ex4">
                    <span class="status-dot"></span>
                    <span data-i18n="status_unsolved"></span>
                </span>
            </div>

            <h2>0ⁿ1ⁿ0ⁿ</h2>

            <p data-i18n="ex4_desc"></p>

            <div class="exercise-tags">
                <span>Multi-pass</span>
                <span>Counting</span>
            </div>

            <div class="difficulty">
                <span data-i18n="difficulty"></span>
                ★★★★☆
            </div>

            <div class="hint-box" id="hint-ex4" style="display:none">
                <span class="hint-icon">💡</span>
                <span data-i18n="ex4_hint"></span>
            </div>

            <div class="card-actions">
                <button class="btn-hint" data-target="hint-ex4" data-i18n="show_hint"></button>
                <button class="btn-try"  data-exercise="ex4"    data-i18n="try_exercise"></button>
            </div>

        </div>

    </div>

</main>

<button id="helpButton" class="help-button" data-i18n-title="help_tooltip">?</button>

<div id="helpModal" class="help-modal">
    <div class="help-modal-content">

        <button id="closeHelp" class="help-close">&times;</button>

        <h2 data-i18n="help_title_exercises"></h2>

        <ul>
            <li data-i18n="help_exercises_1"></li>
            <li data-i18n="help_exercises_2"></li>
            <li data-i18n="help_exercises_3"></li>
            <li data-i18n="help_exercises_4"></li>
        </ul>

    </div>
</div>

<script src="exercises.js"></script>

</body>
</html>
